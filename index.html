<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0b1d2e" />
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>"
  />
  <title>Water Power 3D — Hydro Tycoon</title>
</head>
<body>
  <div id="app">
    <div id="canvas-wrap">
      <canvas id="game-canvas"></canvas>
      <div id="tap-fx-layer" aria-hidden="true"></div>
    </div>

    <!-- Top HUD -->
    <header class="top-hud">
      <div class="stat-pill cash-pill">
        <span class="stat-icon">💧</span>
        <div class="stat-text">
          <div class="stat-main" id="hud-cash">$0</div>
          <div class="stat-sub" id="hud-income">+$0/с</div>
        </div>
      </div>

      <div class="stat-pill power-pill">
        <span class="stat-icon">⚡</span>
        <div class="stat-text">
          <div class="stat-main" id="hud-watts">0 W</div>
          <div class="stat-sub" id="hud-era">Лагерь у ручья</div>
        </div>
      </div>

      <div class="crystal-pill" id="hud-crystals" title="Энерго-кристаллы">💎 5</div>

      <button class="icon-btn" id="btn-profile" title="Профиль" aria-label="Профиль">👤</button>
      <button class="icon-btn" id="btn-sound" title="Звук" aria-label="Звук">🔊</button>
    </header>

    <!-- Collapsible Grand Goal + Zone Bar -->
    <div class="goal-banner" id="goal-banner">
      <div class="goal-head">
        <span class="goal-title" id="goal-title">🎯 ЦЕЛЬ 1/6: Зажечь свет в деревне</span>
        <div class="goal-head-right">
          <span class="goal-numbers" id="goal-numbers">10 W / 120 W</span>
          <button class="mini-collapse-btn" id="btn-goal-collapse" title="Свернуть цель">▾</button>
        </div>
      </div>
      <div class="goal-details" id="goal-details">
        <div class="goal-track">
          <div class="goal-fill" id="goal-fill"></div>
        </div>
        <div class="goal-sub" id="goal-sub">Награда: +$95 · +3 💎</div>
        <div class="zone-strip" id="zone-strip"></div>
      </div>
    </div>

    <!-- Overdrive + Camera Bar + Active Boosters -->
    <div class="mid-controls">
      <div class="overdrive-bar">
        <div class="overdrive-fill" id="overdrive-fill"></div>
        <span class="overdrive-label" id="overdrive-label">⚡ ТАПАЙ ПО ВОДЕ ДЛЯ РАЗГОНА (x1.0)</span>
      </div>

      <div class="cam-bar" role="group" aria-label="Управление камерой">
        <button class="cam-btn active" data-cam="0">🌍 Обзор</button>
        <button class="cam-btn" data-cam="1">🎡 Станции</button>
        <button class="cam-btn" data-cam="3">🏙️ Город</button>
        <button class="pan-toggle-btn" id="btn-pan-toggle" aria-pressed="false">✋ Двигать: ВЫКЛ</button>
      </div>

      <div class="active-boosters hidden" id="active-boosters"></div>
    </div>

    <!-- Goal / Era / Zone Toast -->
    <div class="era-toast hidden" id="era-toast">
      <span class="era-toast-badge" id="era-toast-badge">ЦЕЛЬ ВЫПОЛНЕНА!</span>
      <strong id="era-toast-title">Деревня у воды</strong>
    </div>

    <!-- Bottom Interactive Drawer -->
    <section class="drawer" id="drawer">
      <div class="drawer-header">
        <div class="tabs" role="tablist">
          <button class="tab-btn active" data-tab="stations" role="tab">⚙️ Станции</button>
          <button class="tab-btn" data-tab="upgrades" role="tab">🌊 Апгрейды</button>
          <button class="tab-btn" data-tab="shop" role="tab">🛒 Магазин</button>
          <button class="tab-btn" data-tab="prestige" role="tab">👷 Инженеры</button>
        </div>
        <div class="drawer-controls">
          <button class="mult-btn" id="btn-buy-mult">x1</button>
          <button class="collapse-btn" id="btn-collapse" title="Свернуть панель">▾</button>
        </div>
      </div>

      <div class="drawer-body" id="drawer-body">
        <div class="cards-list" id="cards-list"></div>
      </div>
    </section>

    <!-- Profile Modal -->
    <div class="modal-backdrop hidden" id="profile-modal">
      <div class="modal-card profile-card">
        <div class="modal-head-row">
          <h2>👤 Профиль игрока</h2>
          <button class="mini-close-btn" id="btn-close-profile">✕</button>
        </div>

        <div class="profile-identity">
          <div class="avatar-picker" id="avatar-picker"></div>
          <input
            type="text"
            id="profile-name-input"
            class="profile-name-input"
            maxlength="20"
            placeholder="Ваш никнейм"
          />
          <div class="profile-rank" id="profile-rank">Стажёр на ручье</div>
        </div>

        <div class="profile-stats-grid" id="profile-stats-grid"></div>

        <h3 class="ach-heading">🏆 Достижения (награда 💎)</h3>
        <div class="ach-list" id="ach-list"></div>
      </div>
    </div>

    <!-- Offline Income Modal -->
    <div class="modal-backdrop hidden" id="offline-modal">
      <div class="modal-card">
        <div class="modal-emoji">🌊⚡</div>
        <h2>Станция работала без вас!</h2>
        <p class="modal-desc" id="offline-time">Прошло 0 мин</p>
        <div class="modal-reward" id="offline-reward">+$0</div>
        <button class="primary-btn" id="btn-claim-offline">Забрать прибыль</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
